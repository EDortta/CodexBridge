[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-bridge"
version = "0.1.0"
description = "Secure MCP gateway and reverse executor bridge for Codex CLI"
requires-python = ">=3.10"
dependencies = [
  "aiomysql>=0.2.0",
  "aiosqlite>=0.20.0",
  "fastapi>=0.116.0",
  "greenlet>=3.1.1",
  "httpx>=0.28.0",
  "prometheus-client>=0.22.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dateutil>=2.9.0",
  "python-json-logger>=2.0.7",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32.0",
  "websockets>=15.0",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*", "agent*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-bridge"
version = "0.1.0"
description = "Secure MCP gateway and reverse executor bridge for Codex CLI"
requires-python = ">=3.10"
dependencies = [
  "aiomysql>=0.2.0",
  # Task-finished email notification (issue #70). Not stdlib smtplib: a
  # blocking SMTP call inside an async handler stalls the event loop for
  # every other request — the same trap already documented and fixed once
  # for users.authenticate (see docs/napkin-lessons.md).
  "aiosmtplib>=3.0.0",
  "aiosqlite>=0.20.0",
  # >=0.141.1: tests/contract and tests/integration route-inventory helpers
  # import fastapi.routing.iter_route_contexts() to see through
  # _IncludedRouter (lazy include_router(), shipped in this release) — on an
  # older FastAPI that name does not exist, and app.routes is still the
  # pre-0.141 flattened list. See docs/napkin-lessons.md, "#25: the
  # `contract` CI gate was blind, not the app".
  "fastapi>=0.141.1",
  "greenlet>=3.1.1",
  "httpx>=0.28.0",
  "prometheus-client>=0.22.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dateutil>=2.9.0",
  "python-json-logger>=2.0.7",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32.0",
  "websockets>=15.0",
]

[project.optional-dependencies]
test = [
  # tests/contract/test_declared_examples_are_real.py validates live response
  # bodies against the schemas in the contract. It arrives transitively with
  # openapi-spec-validator, and is declared anyway: a direct import resting on
  # someone else's dependency breaks the day that dependency drops it, in a
  # gate whose whole job is to not be silently absent.
  "jsonschema>=4.20.0",
  "openapi-spec-validator>=0.9.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.0.0",
  "pyyaml>=6.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*", "agent*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

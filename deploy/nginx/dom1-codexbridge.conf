server {
    listen 80;
    listen [::]:80;
    server_name codexbridge.inovacaosistemas.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codexbridge.inovacaosistemas.com.br;

    ssl_certificate /etc/letsencrypt/live/codexbridge.inovacaosistemas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codexbridge.inovacaosistemas.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2m;

    # RETIRED 2026-08-10 — dom1 no longer serves CodexBridge; it only renews the
    # certificate (the acme-challenge block above). This block is the old ingress
    # into the Incus edge proxy and is not in any request path.
    #
    # Putting it back grows the X-Forwarded-For chain by two entries: dom1's and
    # the edge proxy's addresses must then join CODEX_BRIDGE_API_TRUSTED_PROXIES,
    # or every anonymous caller collapses into one rate-limit bucket. See
    # deploy/README.md.
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

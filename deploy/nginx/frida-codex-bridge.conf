server {
    listen 443 ssl http2;
    server_name codexbridge.inovacaosistemas.com.br;

    ssl_certificate /etc/letsencrypt/live/codexbridge.inovacaosistemas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codexbridge.inovacaosistemas.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2m;

    location /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:18080/.well-known/oauth-authorization-server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:18080/.well-known/openid-configuration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:18080/.well-known/oauth-protected-resource;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /oauth/authorize {
        proxy_pass http://127.0.0.1:18080/oauth/authorize;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /oauth/token {
        proxy_pass http://127.0.0.1:18080/oauth/token;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:18080/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /agent/ws {
        proxy_pass http://127.0.0.1:18080/agent/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:18080/healthz;
    }

    # --- Mobile contract surface (epic #1) ------------------------------------
    # This vhost is a location allowlist with no catch-all, so a route that is
    # not named here is a 404 at the front door however well it works in the
    # application. Adding a public route to the gateway is therefore TWO edits:
    # the router, and this file. See docs/api/README.md, "Reaching the API".

    # Liveness. Cheap, touches no dependency, safe to poll.
    location = /health {
        proxy_pass http://127.0.0.1:18080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Readiness. Unauthenticated and not rate-limited at the application: its
    # protection is a cached result (CODEX_BRIDGE_READY_CACHE_SECONDS), so a
    # flood costs one database query per interval rather than one per request.
    location = /ready {
        proxy_pass http://127.0.0.1:18080/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The versioned API and the version probe. Rate limiting happens inside the
    # application, which needs CODEX_BRIDGE_API_TRUSTED_PROXY_HOPS set to
    # (entries in the X-Forwarded-For the gateway receives) - 1. Measure it; do
    # not count proxies. Wrong value and every caller shares a single bucket.
    location /api/ {
        proxy_pass http://127.0.0.1:18080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:18080/metrics;
    }
}

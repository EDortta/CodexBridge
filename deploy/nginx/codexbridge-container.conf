server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 2m;

    location /.well-known/oauth-authorization-server {
        proxy_pass https://192.168.71.248/.well-known/oauth-authorization-server;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /.well-known/openid-configuration {
        proxy_pass https://192.168.71.248/.well-known/openid-configuration;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /.well-known/oauth-protected-resource {
        proxy_pass https://192.168.71.248/.well-known/oauth-protected-resource;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /oauth/authorize {
        proxy_pass https://192.168.71.248/oauth/authorize;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /oauth/token {
        proxy_pass https://192.168.71.248/oauth/token;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /mcp {
        proxy_pass https://192.168.71.248/mcp;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /agent/ws {
        proxy_pass https://192.168.71.248/agent/ws;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /healthz {
        proxy_pass https://192.168.71.248/healthz;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    # --- Mobile contract surface (epic #1) ------------------------------------
    # This vhost is a location allowlist with no catch-all, so a route not named
    # here is a 404 at the front door however well it works in the application.
    # Adding a public route to the gateway is TWO edits: the router, and this
    # file. See docs/api/README.md, "Reaching the API".

    # Liveness. Cheap, touches no dependency, safe to poll.
    location = /health {
        proxy_pass https://192.168.71.248/health;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Readiness. Unauthenticated and not rate-limited at the application: its
    # protection is a cached result (CODEX_BRIDGE_READY_CACHE_SECONDS), so a
    # flood costs one database query per interval rather than one per request.
    location = /ready {
        proxy_pass https://192.168.71.248/ready;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The versioned API and the version probe. Rate limiting happens inside the
    # application, which needs CODEX_BRIDGE_API_TRUSTED_PROXIES to list the
    # addresses of the proxies in front of it — this one included. Unset, the
    # header is ignored and every caller shares one bucket.
    location /api/ {
        proxy_pass https://192.168.71.248/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

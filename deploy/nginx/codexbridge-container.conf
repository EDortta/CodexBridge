server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 2m;

    location /.well-known/oauth-authorization-server {
        proxy_pass https://192.168.71.248/.well-known/oauth-authorization-server;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /.well-known/openid-configuration {
        proxy_pass https://192.168.71.248/.well-known/openid-configuration;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /.well-known/oauth-protected-resource {
        proxy_pass https://192.168.71.248/.well-known/oauth-protected-resource;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /oauth/authorize {
        proxy_pass https://192.168.71.248/oauth/authorize;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /oauth/token {
        proxy_pass https://192.168.71.248/oauth/token;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /mcp {
        proxy_pass https://192.168.71.248/mcp;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /agent/ws {
        proxy_pass https://192.168.71.248/agent/ws;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /healthz {
        proxy_pass https://192.168.71.248/healthz;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name codexbridge.inovacaosistemas.com.br;
        proxy_set_header Host codexbridge.inovacaosistemas.com.br;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

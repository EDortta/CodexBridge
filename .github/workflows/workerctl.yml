name: workerctl

on:
  push:
    branches: ['feature/workerctl-activation-8h']
    paths:
      - 'scripts/workerctl.py'
      - 'tests/unit/test_workerctl.py'
      - '.github/workflows/workerctl.yml'
  pull_request:
    paths:
      - 'scripts/workerctl.py'
      - 'tests/unit/test_workerctl.py'
      - '.github/workflows/workerctl.yml'

jobs:
  workerctl:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install 'pytest>=9.0'
      - name: Test standalone worker activation CLI
        run: python -m pytest -q tests/unit/test_workerctl.py
